<!DOCTYPE html>
<html lang="id">
<head>

<script data-cfasync="false" async type="text/javascript" src="//tx.refugespistol.com/rQWjDLqO2So3iQ/156328"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TONTONAN VIRAL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
  color: #172238;
}

.page {
  width: 100%;
  max-width: 720px;
  margin: auto;
  min-height: 100vh;
}

.header {
  height: 86px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  border-bottom: 1px solid #eee;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 27px;
  font-weight: 700;
  flex: 1;
  min-width: 0;
}

.logo {
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: #172238;
  color: #fff;
  font-size: 26px;
  font-weight: 800;
  flex-shrink: 0;
}

.co {
  color: #1475d1;
}

.actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.wa {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 48px;
  padding: 0 16px;
  border-radius: 13px;
  background: #25D366;
  color: #fff;
  text-decoration: none;
  font-size: 16px;
  font-weight: 800;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(37,211,102,.2);
}

.wa:hover {
  background: #1fbd5b;
}

.upload {
  border: 0;
  border-radius: 13px;
  padding: 15px 21px;
  min-height: 48px;
  background: #172238;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.upload:hover {
  background: #24324d;
}

.ad {
  margin: 27px 28px 14px;
  color: #778294;
  font-size: 21px;
}

.video-box {
  position: relative;
  margin: 0 28px;
  overflow: hidden;
  border-radius: 29px;
  background: #171717;
  aspect-ratio: 9 / 16;
}

.video-box video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: pointer;
}

.video-box.playing .poster,
.video-box.playing .play-button {
  display: none;
}

.play-button {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 118px;
  height: 118px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.95);
  cursor: pointer;
}

.play-button:after {
  content: "";
  position: absolute;
  left: 48%;
  top: 37%;
  border-left: 32px solid #111;
  border-top: 21px solid transparent;
  border-bottom: 21px solid transparent;
}

.ad-container {
  margin: 20px 28px;
  padding: 10px;
  background: #f9f9f9;
  border-radius: 12px;
  text-align: center;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.note {
  text-align: center;
  color: #777;
  font-size: 13px;
  padding: 10px 20px 30px;
}

@media(max-width:600px) {

  .header {
    height: 78px;
    padding: 0 16px;
    gap: 8px;
  }

  .brand {
    font-size: 21px;
    gap: 9px;
  }

  .logo {
    width: 43px;
    height: 43px;
    border-radius: 11px;
    font-size: 23px;
  }

  .actions {
    gap: 6px;
  }

  .wa {
    min-height: 42px;
    padding: 0 11px;
    border-radius: 11px;
    font-size: 13px;
  }

  .upload {
    min-height: 42px;
    padding: 12px 14px;
    border-radius: 11px;
    font-size: 14px;
  }

  .ad {
    margin: 22px 16px 12px;
    font-size: 18px;
  }

  .video-box {
    margin: 0 16px;
    border-radius: 25px;
  }

  .play-button {
    width: 92px;
    height: 92px;
  }

  .play-button:after {
    border-left-width: 25px;
    border-top-width: 16px;
    border-bottom-width: 16px;
  }

  .ad-container {
    margin: 15px 16px;
  }
}

</style>
</head>

<body>

<div class="page">

  <!-- HEADER -->
  <header class="header">

    <div class="brand">
      <div class="logo">V</div>
      <span>vldey<span class="co">.co</span></span>
    </div>

    <div class="actions">

      <a class="wa"
         href="https://videy.it.com"
         target="_blank"
         rel="noopener noreferrer">
        💬 WEB UTAMA
      </a>

      <button class="upload"
        onclick="document.getElementById('fileInput').click()">
        Upload
      </button>

      <input
        id="fileInput"
        type="file"
        accept="video/*"
        hidden>

    </div>

  </header>

  <!-- JUDUL -->
  <div class="ad">
    WEB UTAMA BANYAK PILIHAN
  </div>

  <!-- VIDEO PLAYER -->
  <section class="video-box" id="videoBox">

    <video id="video" controls playsinline preload="metadata">
      <source
        src="https://videy.it.com/videos/full sama ABG.mp4"
        type="video/mp4">
    </video>

    <img
      class="poster"
      src="poster.png"
      alt="Preview video">

    <button
      class="play-button"
      id="playButton"
      aria-label="Putar video">
    </button>

  </section>

  <!-- IKLAN BANNER -->
  <div class="ad-container">

    <script>
      atOptions = {
        'key': '478d9e9794d2a599218056a9dfe30455',
        'format': 'iframe',
        'height': 60,
        'width': 468,
        'params': {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/478d9e9794d2a599218056a9dfe30455/invoke.js"></script>

  </div>

  <!-- IKLAN TAMBAHAN -->
  <div style="text-align:center;margin:10px 0;">

    <script
      async="async"
      data-cfasync="false"
      src="https://pl31701187.profitableratecpmnetwork.com/6dc180e2066de0363f92fcbbe4318b18/invoke.js">
    </script>

    <div id="container-6dc180e2066de0363f92fcbbe4318b18"></div>

  </div>

  <!-- IKLAN TAMBAHAN KEDUA -->
  <div style="text-align:center;margin:10px 0;">

    <script
      async="async"
      data-cfasync="false"
      src="https://pl31701187.profitableratecpmnetwork.com/6dc180e2066de0363f92fcbbe4318b18/invoke.js">
    </script>

    <div id="container-6dc180e2066de0363f92fcbbe4318b18"></div>

  </div>

  <div class="note">
    Video Player
  </div>

</div>

<script>

const box = document.getElementById('videoBox');
const video = document.getElementById('video');
const play = document.getElementById('playButton');
const poster = document.querySelector('.poster');
const fileInput = document.getElementById('fileInput');

const linkTujuan =
  'https://vt.tokopedia.com/t/ZS9fqVDytK8EA-FSH9q/';

let klikPertama = false;

function startVideo() {

  // KLIK PERTAMA MEMBUKA LINK TUJUAN
  if (!klikPertama) {

    klikPertama = true;

    window.open(
      linkTujuan,
      '_blank',
      'noopener,noreferrer'
    );

    return;
  }

  // KLIK KEDUA MEMUTAR VIDEO
  box.classList.add('playing');

  video.play().catch(function(error) {
    console.log('Video gagal diputar:', error);
  });

}

// EVENT TOMBOL PLAY DAN POSTER
play.addEventListener('click', startVideo);
poster.addEventListener('click', startVideo);

// STATUS VIDEO
video.addEventListener('play', function() {
  box.classList.add('playing');
});

video.addEventListener('pause', function() {
  if (!video.ended) {
    box.classList.remove('playing');
  }
});

video.addEventListener('ended', function() {
  box.classList.remove('playing');
});

// UPLOAD VIDEO SENDIRI
fileInput.addEventListener('change', function() {

  const file = this.files[0];

  if (!file) return;

  const url = URL.createObjectURL(file);

  video.src = url;

  box.classList.add('playing');

  video.play().catch(function(error) {
    console.log(error);
  });

});

</script>

</body>
</html>
